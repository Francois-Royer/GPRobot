<html>
<head>
    <head>
        <title>Genetic Programming Robocade Statistics</title>
        <!--        <meta http-equiv="refresh" content="60" />-->
    </head>
    <script charset="utf-8" src="https://cdn.plot.ly/plotly-3.1.0.min.js" type="text/javascript"></script>
    <script src="https://dygraphs.com/2.2.1/dist/dygraph.min.js" type="text/javascript"></script>
    <script src="https://dygraphs.com/2.2.1/dist/extras/smooth-plotter.js" type="text/javascript"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js" type="text/javascript"></script>
    <link href="dygraph.css" rel="stylesheet" type="text/css">
</head>
<body>
<style>.dygraph-legend {
    text-align: right;
    background: none;
}</style>
<div class="container" style="width: 100%;">
    <div class="chart" id="graphdiv" style="width:800px; height:400px; float: left;"></div>
    <div class="chart" id="graphdiv2" style="width:800px; height:400px; margin-left: 802px;"></div>
</div>
<p><b>Show Series:</b></p>
<Span><p>
    <input checked id="0" onClick="change(this)" type=checkbox>
    <label for="0"> Average Fitness</label><br/>
    <input checked id="1" onClick="change(this)" type=checkbox>
    <label for="1"> Best Fitness</label><br/>
    <input checked id="2" onClick="change2(this)" type=checkbox>
    <label for="2"> Average Node</label><br/>
    <input checked id="3" onClick="change2(this)" type=checkbox>
    <label for="3"> Best Node</label>
</p></Span><span>
<p class="smoother">Smoothing:&nbsp;<input id="smoothing-amount" max="0.7" min="0" step="0.01" type="range"
                                           value="0.33"></p>
</span>
<div class="container" style="width: 100%;">
    <div class="chart" id="graphdiv3" style="width:800px; height:400px; float: left;"></div>
    <div class="chart" id="graphdiv4" style="width:800px; height:400px; margin-left: 802px;"></div>
</div>


<script type="text/javascript">
    var g;
    var g2;

    function drawPlot() {
        g = new Dygraph(
            document.getElementById("graphdiv"),
            "run_data.txt", {
                legend: 'always',
                xlabel: 'Generation',
                ylabel: 'Fitness',
                plotter: smoothPlotter,
                strokeWidth: 2,
                visibility: [true, true, false, false, false]
            }
        );

        g2 = new Dygraph(
            document.getElementById("graphdiv2"),
            "run_data.txt", {
                legend: 'always',
                xlabel: 'Generation',
                ylabel: 'Nodes',
                plotter: smoothPlotter,
                strokeWidth: 2,
                visibility: [false, false, true, true, false]
            }
        );
    }

    drawPlot();

    function change(el) {
        g.setVisibility(parseInt(el.id), el.checked);
    }

    function change2(el) {
        g2.setVisibility(parseInt(el.id), el.checked);
    }

    function setData(lines) {
        g.updateOptions({file: lines});
        g2.updateOptions({file: lines});
    }

    var smoothRangeEl = document.getElementById('smoothing-amount');
    smoothRangeEl.addEventListener('input', function () {
        var param = parseFloat(smoothRangeEl.value);
        smoothPlotter.smoothing = param;
        drawPlot()
    });

    function loadData() {
        $.ajax({
            type: "GET",
            url: "run_data.txt",
            dataType: "text",
            success: function (data) {
                processData(data);
            }
        });
    }

    function processData(allText) {
        var allTextLines = allText.split(/\r\n|\n/);
        var headers = allTextLines[0].split(',');
        var lines = [];

        for (var i = 1; i < allTextLines.length; i++) {
            var data = allTextLines[i].split(',');
            if (data.length == headers.length) {

                var tarr = [];
                for (var j = 0; j < headers.length; j++) {
                    tarr.push(headers[j] + ":" + data[j]);
                }
                lines.push(tarr);
            }
        }
        setData(lines)
    }

    //var intervalId = setIterval(drawPlot, 30 * 1000);

</script>
</body>
</html>
